# Builds the Android release bundle (.aab) in the cloud. Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
name: Android build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx esbuild src/native.js --bundle --minify --format=iife --outfile=www/native.js
      - run: npx cap sync android
      - name: Restore keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}", PW: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          mkdir -p keys && echo "$KS" | base64 --decode > keys/skyroute-upload.jks
          printf "storeFile=../keys/skyroute-upload.jks\nstorePassword=%s\nkeyAlias=skyroute\nkeyPassword=%s\n" "$PW" "$PW" > android/keystore.properties
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: SkyRoute-android, path: "android/app/build/outputs/**/release/*.a*" }
