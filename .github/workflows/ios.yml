# Builds the iPhone app on GitHub's macOS runners — no Mac needed.
# 1) Push this repo to GitHub.  2) Add the secrets listed below (Settings → Secrets → Actions).
# 3) Run the workflow (Actions tab → "iOS build" → Run workflow). It uploads the build to TestFlight.
#
# Secrets needed (all from your Apple Developer account, see README-STORES.md):
#   APPLE_CERT_P12_BASE64   – distribution certificate (.p12) base64-encoded
#   APPLE_CERT_PASSWORD     – password for that .p12
#   APPLE_PROVISION_BASE64  – App Store provisioning profile (.mobileprovision) base64-encoded
#   APPLE_TEAM_ID           – 10-character team ID
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64 – App Store Connect API key (for the TestFlight upload)
name: iOS build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx esbuild src/native.js --bundle --minify --format=iife --outfile=www/native.js
      - run: npx cap sync ios
      - name: Install signing certificate & profile
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISION_BASE64 }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          echo "$PROFILE" | base64 --decode > profile.mobileprovision
          security create-keychain -p tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p tmp build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive
        env: { TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}" }
        run: |
          cd ios/App && pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive DEVELOPMENT_TEAM=$TEAM_ID \
            -allowProvisioningUpdates archive
      - name: Export IPA
        run: |
          cd ios/App
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>uploadSymbols</key><true/></dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist export.plist -exportPath build/ipa -allowProvisioningUpdates
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f ios/App/build/ipa/App.ipa -t ios --apiKey $KEY_ID --apiIssuer $ISSUER_ID
      - uses: actions/upload-artifact@v4
        with: { name: SkyRoute-ipa, path: ios/App/build/ipa/*.ipa }
