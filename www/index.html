<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkyRoute">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SkyRoute — navigation with weather</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="native.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:rgba(13,20,36,.93); --panel2:#141d33; --line:rgba(255,255,255,.08);
    --fg:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --good:#22c55e; --wet:#3b82f6; --storm:#a855f7; --warn:#f59e0b; --bad:#ef4444;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --radius:16px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  input{-webkit-user-select:text;user-select:text}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden;overscroll-behavior:none}
  #map{position:fixed;inset:0}
  .maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.7)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  .hidden{display:none!important}

  /* ---------- top area ---------- */
  #top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
  #top>*{pointer-events:auto}
  .row{display:flex;gap:8px;align-items:stretch}
  #search{flex:1;position:relative;z-index:3}
  #q{width:100%;height:56px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:0 48px 0 16px;font-size:18px;box-shadow:var(--shadow);outline:none;backdrop-filter:blur(12px)}
  #q::placeholder{color:var(--muted)}
  #qclear{position:absolute;right:6px;top:8px;width:40px;height:40px;border-radius:50%;color:var(--muted);font-size:24px}
  #results{position:fixed;left:12px;right:12px;max-width:536px;margin:0 auto;top:calc(var(--sat) + 72px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(12px)}
  #results button{display:block;width:100%;text-align:left;padding:16px;border-bottom:1px solid var(--line);font-size:17px}
  #results button:last-child{border-bottom:0}
  #results b{display:block;font-weight:600}
  #results span{color:var(--muted);font-size:14px}
  #results{max-height:60vh;overflow:auto}
  #results button{position:relative;padding-right:76px}
  #results em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;color:var(--accent);font-size:15px}
  .favrow{display:flex;border-bottom:1px solid var(--line)} .favrow button{border-bottom:0!important;padding-right:16px!important}
  .favrow .favdel{flex:0 0 60px;width:60px;text-align:center;font-size:28px;color:var(--muted)}
  #bar #favbtn{flex:0 0 56px;width:56px;padding:0;font-size:30px;line-height:1;color:var(--muted);background:var(--panel2)} #bar #favbtn.on{color:#fbbf24} body.nav #favbtn{display:none}
  #favpick{display:flex;gap:10px;margin-top:10px} #favpick .btn{height:60px;font-size:18px} #favpick{margin:0 0 8px}
  #status{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 16px);z-index:12;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;backdrop-filter:blur(12px);max-width:536px;margin:0 auto}
  #status .t{font-size:20px;font-weight:800} #status .d{color:var(--muted);font-size:15px;margin-top:4px} #status .a{display:flex;gap:10px;margin-top:12px} #status .a .btn{height:56px;font-size:18px}
  #verchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);pointer-events:none}
  .verline{text-align:center;color:var(--muted);font-size:13px;margin-top:18px;opacity:.8}
  #levelscreen{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(var(--sat) + 24px) 24px calc(var(--sab) + 24px);text-align:center}
  #levelscreen h2{font-size:28px;margin:0} #levelscreen p{color:var(--muted);font-size:19px;margin:0;max-width:420px}
  #levelscreen .phone{font-size:72px;line-height:1;animation:tilt 2.4s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  #levelscreen .go{width:100%;max-width:420px;height:96px;font-size:30px;border-radius:22px;background:var(--good);color:#04160a;font-weight:900;letter-spacing:.02em}
  #levelscreen .skip{width:100%;max-width:420px;height:64px;font-size:19px;border-radius:16px;background:var(--panel2);color:var(--muted);font-weight:700}
  #levelscreen .state{min-height:28px;font-size:18px;font-weight:700;color:var(--accent)}

  .chip{height:56px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 12px;backdrop-filter:blur(12px);line-height:1.1}
  #wx .ic{font-size:26px;line-height:1} #wx .t{font-size:24px;font-weight:800} #wx .w{font-size:12px;color:var(--muted);text-align:left}
  #compass .rose{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.25);position:relative;transition:transform .3s;flex:0 0 auto}
  .rose::before{content:'';position:absolute;left:50%;top:2px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:13px solid #ef4444;transform:translateX(-50%)}
  .rose::after{content:'';position:absolute;left:50%;bottom:2px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:13px solid rgba(255,255,255,.6);transform:translateX(-50%)}
  #compass .hd{color:var(--accent);font-size:18px;font-weight:800} #compass .deg{color:var(--muted);font-size:13px}
  @media (max-width:420px){ #wx .w{display:none} #wx{padding:0 10px} }

  #alert{border-radius:12px;background:linear-gradient(90deg,#b91c1c,#dc2626);padding:12px 14px;box-shadow:var(--shadow);font-weight:600;display:flex;gap:10px;align-items:center;text-align:left}
  #alert.moderate{background:linear-gradient(90deg,#b45309,#d97706)}
  #alert.minor{background:linear-gradient(90deg,#1d4ed8,#2563eb)}
  #alert small{font-weight:400;opacity:.9;display:block;font-size:12px}

  /* maneuver banner + ride instruments (navigation only) */
  #banner{border-radius:var(--radius);background:linear-gradient(180deg,#16a34a,#15803d);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center;min-height:104px;text-align:left}
  #banner .arrow{font-size:58px;line-height:1;width:70px;text-align:center}
  #banner .dist{font-size:36px;font-weight:800;line-height:1.05}
  #banner .text{font-size:19px;font-weight:600;opacity:.95;margin-top:3px}
  #banner .then{font-size:13px;opacity:.8;margin-top:4px}
  #inst{display:flex;gap:8px}
  #inst .box{flex:1;min-width:0;height:74px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(12px);padding:0 8px}
  #inst .box.big{flex:1.7} #inst .box.big .v{font-size:34px}
  #inst .rose{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.25);position:relative;transition:transform .3s;flex:0 0 auto}
  #inst .v{font-size:30px;font-weight:800;line-height:1;color:var(--accent)} #inst .v small{font-size:16px;color:var(--muted);font-weight:600}
  #inst .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;text-align:center}
  #inst .k{display:flex;flex-direction:column;align-items:center;min-width:0}
  #inst .k .v{color:var(--fg);font-size:22px;white-space:nowrap} #inst .k .v small{font-size:12px}
  #inst .k.alt .v{color:#fbbf24} #inst .k.lean .v{color:#f472b6}
  #inst #alertbadge{flex:0 0 56px;font-size:26px;background:linear-gradient(90deg,#b45309,#d97706);border:0}
  #inst #wxmini{flex:0 0 76px;flex-direction:column;gap:0}
  #inst #wxmini .ic{font-size:22px;line-height:1} #inst #wxmini .t{font-size:20px;font-weight:800}

  /* ---------- side buttons ---------- */
  #side{position:fixed;right:12px;bottom:calc(var(--sheet-h, 120px) + 12px);display:flex;flex-direction:column;gap:12px;z-index:4;transition:bottom .25s}
  .fab{width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:26px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px)}
  .fab.on{background:var(--accent);color:#04121c}

  /* ---------- bottom sheet ---------- */
  #sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;box-shadow:0 -8px 30px rgba(0,0,0,.4);padding:0 16px calc(var(--sab) + 12px);z-index:6;backdrop-filter:blur(14px);transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:none}
  #sheet.show{transform:none}
  #sheet.dragging{transition:none}
  .grip{width:48px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:10px auto 8px}
  #bar{display:flex;align-items:center;gap:12px;min-height:64px}
  #bar .eta{font-size:30px;font-weight:800;color:var(--good)}
  #bar .sub{color:var(--muted);font-size:17px}
  #bar .sp{flex:1}
  #bar .btn{flex:0 0 auto;height:56px;padding:0 24px;border-radius:14px;font-size:19px;font-weight:800}
  #bar #barspeed{font-size:26px;font-weight:800;color:var(--fg)} #bar #barspeed small{font-size:14px;color:var(--muted);font-weight:600}
  #more{overflow:hidden}
  #sheet.collapsed #more{display:none}
  .modes{display:flex;gap:6px;background:var(--panel2);border-radius:12px;padding:4px;margin:4px 0 10px}
  .modes button{flex:1;min-height:60px;padding:6px 2px;border-radius:9px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.1}
  .modes button b{font-size:15px;font-weight:700} .modes button small{font-size:13px;font-weight:500;opacity:.85}
  .modes button.on{background:var(--accent);color:#04121c}
  #dest{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  .head{padding:12px 14px;border-radius:12px;background:var(--panel2);display:flex;gap:10px;align-items:center;font-weight:500;font-size:17px}
  .head .ic{font-size:24px}
  .head.wet{border-left:4px solid var(--wet)} .head.storm{border-left:4px solid var(--storm)} .head.good{border-left:4px solid var(--good)} .head.warn{border-left:4px solid var(--warn)}
  #strip{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:none;touch-action:pan-x}
  #strip::-webkit-scrollbar{display:none}
  .pt{flex:0 0 auto;min-width:96px;padding:8px 10px;border-radius:12px;background:var(--panel2);text-align:center;border-top:3px solid var(--good)}
  .pt.wet{border-color:var(--wet)} .pt.storm{border-color:var(--storm)} .pt.warn{border-color:var(--warn)} .pt.snow{border-color:#7dd3fc}
  .pt .mi{font-size:11px;color:var(--muted)} .pt .ic{font-size:24px;margin:2px 0} .pt .tp{font-weight:700;font-size:18px} .pt .pp{font-size:11px;color:var(--muted)}
  .live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .live div{background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center}
  .live b{display:block;font-size:19px} .live span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .actions{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;height:64px;border-radius:14px;font-size:20px;font-weight:800;background:var(--panel2)}
  .btn.primary{background:var(--good);color:#04160a}
  .btn.danger{background:var(--bad)}
  .btn.ghost{flex:0 0 auto;padding:0 20px}
  #planactions .btn{flex:1;padding:0 6px;font-size:17px;white-space:nowrap} #planactions #clearbtn{flex:0 0 56px}
  #elev{font-size:14px;color:var(--muted);margin-top:4px}
  #road,#sun{font-size:14px;color:var(--muted);margin-top:4px} #road.warn,#sun.warn{color:#fbbf24}
  #poirow{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none;touch-action:pan-x} #poirow::-webkit-scrollbar{display:none}
  #poirow button{flex:0 0 auto;height:44px;padding:0 12px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:15px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  #poirow button.on{color:var(--fg);border-color:rgba(255,255,255,.25);background:#1e2a47}
  .poi{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;border:2px solid #0b1220;box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .poi.camera{background:#fde047;border-color:#854d0e} .poi.hazard{background:#fb923c;border-color:#7c2d12;width:28px;height:28px;font-size:15px}
  #poipop{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 76px);z-index:7;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(12px);max-width:536px;margin:0 auto}
  #poipop .ic{font-size:34px} #poipop .nm{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #poipop .sb{color:var(--muted);font-size:14px} #poipop .info{flex:1;min-width:0}
  #poipop .btn{flex:0 0 auto;height:52px;padding:0 16px;font-size:17px}
  #ahead{display:flex;gap:8px} #ahead .box{flex:1;height:52px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:800;backdrop-filter:blur(12px);white-space:nowrap;padding:0 10px;overflow:hidden}
  #ahead .box small{font-size:13px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis} #ahead .box.camera{background:linear-gradient(90deg,#a16207,#ca8a04);border:0} #ahead .box.hazard{background:linear-gradient(90deg,#c2410c,#ea580c);border:0}

  /* ---------- panels ---------- */
  .overlay{position:fixed;inset:0;background:rgba(3,7,18,.6);z-index:20;display:flex;align-items:flex-end}
  .overlay .card{width:100%;max-height:86vh;overflow:auto;background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;padding:16px 18px calc(var(--sab) + 18px)}
  .cur{display:flex;align-items:center;gap:16px}
  .cur .ic{font-size:60px} .cur .t{font-size:48px;font-weight:800;line-height:1} .cur .d{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .grid div{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}
  .grid b{display:block;font-size:20px} .grid span{font-size:12px;color:var(--muted)}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
  h2{margin:0;font-size:24px}
  #hours{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
  #hours::-webkit-scrollbar{display:none}
  .alertcard{background:var(--panel2);border-left:4px solid var(--bad);border-radius:12px;padding:12px;margin-bottom:8px}
  .alertcard b{display:block} .alertcard p{margin:6px 0 0;font-size:14px;color:var(--muted);white-space:pre-wrap;max-height:180px;overflow:auto;-webkit-user-select:text;user-select:text}
  .toggle{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:12px;padding:14px;font-weight:600}
  .toggle .sw{width:56px;height:32px;border-radius:16px;background:#334155;position:relative;transition:background .2s}
  .toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:27px}
  #radartime{font-size:13px;color:var(--muted);position:fixed;left:12px;bottom:calc(var(--sheet-h, 120px) + 12px);background:var(--panel);padding:8px 12px;border-radius:10px;z-index:4;border:1px solid var(--line)}

  #ridespanel{position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto;padding:calc(var(--sat) + 14px) 18px calc(var(--sab) + 18px)}
  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
  .totals div{background:var(--panel2);border-radius:14px;padding:14px 8px;text-align:center}
  .totals b{display:block;font-size:26px;color:var(--accent)} .totals span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .ride{background:var(--panel2);border-radius:14px;padding:14px;margin-bottom:10px}
  .ride b{display:block;font-size:18px} .ride .m{color:var(--muted);font-size:14px;margin:3px 0 10px}
  .ride .rb{display:flex;gap:8px} .ride .rb button{flex:1;height:48px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:15px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stats div{background:var(--panel2);border-radius:12px;padding:12px 6px;text-align:center}
  .stats b{display:block;font-size:22px} .stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  #trackbar{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 10px);z-index:7;display:flex;gap:8px;align-items:center}
  #trackbar .chip{flex:1;font-weight:700;font-size:17px}

  #summary{z-index:28} #summary .card{max-height:92vh}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h, 120px) + 24px);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:30;box-shadow:var(--shadow);max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}

  .me{width:28px;height:28px;position:relative}
  .me .cone{position:absolute;left:50%;bottom:50%;width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-bottom:84px solid rgba(56,189,248,.25);transform:translateX(-50%);border-radius:50%;transform-origin:bottom center}
  .me .dot{position:absolute;inset:0;border-radius:50%;background:#38bdf8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(56,189,248,.5),0 2px 8px rgba(0,0,0,.4)}
  .me .arrowhead{position:absolute;left:50%;top:-10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #fff;transform:translateX(-50%)}
  @media (min-width:700px){ #top,#sheet,#trackbar{max-width:560px} }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="row" id="toprow">
    <div id="search">
      <input id="q" type="search" placeholder="Where to?" autocomplete="off" enterkeyhint="search">
      <button id="qclear" class="hidden" aria-label="Clear">×</button>
      <div id="results" class="hidden"></div>
    </div>
    <button id="wx" class="chip" aria-label="Weather"><span class="ic">…</span><span class="t">--°</span><span class="w">loading<br>weather</span></button>
    <button id="compass" class="chip" title="Tap to point map north"><div class="rose"></div><span><span class="hd">--</span><br><span class="deg"></span></span></button>
  </div>
  <button id="banner" class="hidden">
    <div class="arrow">↑</div>
    <div><div class="dist">--</div><div class="text">--</div><div class="then hidden"></div></div>
  </button>
  <div id="inst" class="hidden">

<script>
/* ===================== SkyRoute ===================== *
 * Navigation + weather + ride telemetry for motorcyclists.
 * Data: OpenFreeMap tiles (OSM), Valhalla/OSRM routing, Photon/Nominatim
 * geocoding, Open-Meteo weather + elevation, RainViewer radar, NWS alerts.
 * ==================================================== */
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');
const MI = 1609.344, FT = 3.28084;
const MODES = ['scenic', 'balanced', 'fast'];

const S = {
  pos: null, heading: 0, speed: 0, alt: null, follow: true, hasFix: false,
  dest: null, route: null, routes: null, navigating: false, mode: 'balanced',
  wx: null, wxAt: null, wxTime: 0, alerts: [], alertsTime: 0, seenAlerts: {},
  radar: null, radarOn: false, radarTimer: null, radarIdx: 0,
  offRouteCount: 0, lastReroute: 0, wake: null, lastVoice: '',
  demoTimer: null, demoAlong: 0, ride: null, sheetCollapsed: false,
  motion: { ok: false, cal: null, g: null, lean: 0, pitch: 0, maxL: 0, maxR: 0, maxBrake: 0, maxAccel: 0, gfilt: [0, 0, 0] },
  battery: { level: null, warned: false },
};
const CAP = window.CapNative || null;
S.gps = { started: 0, fixes: 0, last: 0, acc: null, err: null, source: null };
const WEB_BUILD = '1.2 (7)';   // shown when not running inside the native app
S.appVersion = WEB_BUILD;
(async () => { try { if (CAP && CAP.App) { const i = await CAP.App.getInfo(); S.appVersion = `${i.version} (${i.build})`; } } catch (e) { } const v = document.getElementById('verchip'); if (v) { v.textContent = 'SkyRoute ' + S.appVersion; v.classList.remove('hidden'); setTimeout(() => v.classList.add('hidden'), 4000); } })();
if (CAP) document.body.classList.add('native');
const store = { get(k, d) { try { const v = localStorage.getItem('skyroute.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('skyroute.' + k, JSON.stringify(v)); } catch (e) { } } };
S.mode = store.get('mode', 'balanced');

/* ---------- tiny IndexedDB store for ride tracks ---------- */
const DB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('skyroute', 1); r.onupgradeneeded = () => r.result.createObjectStore('tracks'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(id, v) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('tracks', 'readwrite'); t.objectStore('tracks').put(v, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { console.warn(e); } },
  async get(id) { try { const db = await this.open(); return await new Promise((res, rej) => { const r = db.transaction('tracks').objectStore('tracks').get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { return null; } },
  async del(id) { try { const db = await this.open(); db.transaction('tracks', 'readwrite').objectStore('tracks').delete(id); } catch (e) { } },
};

/* ---------- map ---------- */
const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [-122.03, 37.97], zoom: 11, attributionControl: false, pitchWithRotate: false });
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
const mapReady = new Promise(res => map.on('load', res));
map.touchPitch.disable();
const meEl = document.createElement('div'); meEl.className = 'me'; meEl.innerHTML = '<div class="cone"></div><div class="dot"></div><div class="arrowhead"></div>';
const meMarker = new maplibregl.Marker({ element: meEl, rotationAlignment: 'map', pitchAlignment: 'map' });
let destMarker = null;
const EMPTY = { type: 'FeatureCollection', features: [] };
map.on('load', () => {
  map.addSource('route', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#0c3c8c', 'line-width': 11, 'line-opacity': .7 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#3b8bff', 'line-width': 6 } });
  map.addSource('track', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'track-line', type: 'line', source: 'track', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#f472b6', 'line-width': 5 } });
  map.addSource('rwx', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'rwx-dot', type: 'circle', source: 'rwx', paint: { 'circle-radius': 10, 'circle-color': ['get', 'color'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'rwx-label', type: 'symbol', source: 'rwx', layout: { 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-offset': [0, -1.5], 'text-anchor': 'bottom', 'text-allow-overlap': true }, paint: { 'text-color': '#0b1220', 'text-halo-color': '#fff', 'text-halo-width': 2 } });
});
map.on('dragstart', () => { if (S.hasFix) { S.follow = false; $('#recenter').classList.remove('hidden'); } });
map.on('rotate', () => renderRose());
map.on('click', e => { if (!S.hasFix && !S.pos) { setPosition(e.lngLat.lng, e.lngLat.lat, 0, 0, null, true); toast('Start set here (no GPS)'); } });

/* ---------- geo helpers ---------- */
const R = 6371000, rad = d => d * Math.PI / 180;
function haversine(a, b) { const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]); const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function bearing(a, b) { const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1])); const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0])); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }
function compass(b) { return ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(((b % 360) + 360) % 360 / 45) % 8]; }
function compassShort(b) { return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(((b % 360) + 360) % 360 / 45) % 8]; }
function nearestOnRoute(coords, cum, p) {
  let best = { d: Infinity, along: 0, idx: 0 }; const kx = Math.cos(rad(p[1]));
  for (let i = 0; i < coords.length - 1; i++) {
    const a = coords[i], b = coords[i + 1];
    const ax = (a[0] - p[0]) * kx, ay = a[1] - p[1], bx = (b[0] - p[0]) * kx, by = b[1] - p[1];
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? -(ax * dx + ay * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy) * 111320;
    if (d < best.d) best = { d, along: cum[i] + t * (cum[i + 1] - cum[i]), idx: i };
  }
  return best;
}
function pointAt(coords, cum, along) {
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < along) lo = m + 1; else hi = m; }
  const i = Math.max(1, lo); const t = (cum[i] - cum[i - 1]) ? (along - cum[i - 1]) / (cum[i] - cum[i - 1]) : 0;
  const a = coords[i - 1], b = coords[i]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, i];
}

/* ---------- formatting ---------- */
const fmtDist = m => m >= 0.19 * MI ? (m / MI).toFixed(m / MI >= 10 ? 0 : 1) + ' mi' : Math.max(50, Math.round(m * 3.281 / 50) * 50) + ' ft';
const fmtDur = s => { const m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + ' hr ' + (m % 60) + ' min' : m + ' min'; };
const fmtHM = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h}h ${m}m` : `${m}m`; };
const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtFt = m => Math.round(m * FT).toLocaleString();
const spokenDist = m => { const mi = m / MI; if (mi >= 0.9) return (Math.round(mi * 2) / 2).toString().replace('.5', ' and a half') + ' miles'; if (mi >= 0.45) return 'half a mile'; if (mi >= 0.2) return 'a quarter mile'; return Math.round(m * 3.281 / 100) * 100 + ' feet'; };
function toast(t, ms = 2500) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms); }

/* ---------- weather codes (WMO) ---------- */
function wmo(code, isDay = 1) {
  const c = code | 0;
  if (c === 0) return { ic: isDay ? '☀️' : '🌙', label: 'Clear', sev: 'good' };
  if (c === 1) return { ic: isDay ? '🌤' : '🌙', label: 'Mostly clear', sev: 'good' };
  if (c === 2) return { ic: '⛅', label: 'Partly cloudy', sev: 'good' };
  if (c === 3) return { ic: '☁️', label: 'Overcast', sev: 'good' };
  if (c === 45 || c === 48) return { ic: '🌫', label: 'Fog', sev: 'warn' };
  if (c >= 51 && c <= 55) return { ic: '🌦', label: 'Drizzle', sev: 'wet' };
  if (c === 56 || c === 57 || c === 66 || c === 67) return { ic: '🌧', label: 'Freezing rain', sev: 'snow' };
  if (c >= 61 && c <= 65) return { ic: '🌧', label: c === 61 ? 'Light rain' : c === 63 ? 'Rain' : 'Heavy rain', sev: 'wet' };
  if (c >= 71 && c <= 77) return { ic: '🌨', label: 'Snow', sev: 'snow' };
  if (c >= 80 && c <= 82) return { ic: '🌦', label: c === 80 ? 'Light showers' : 'Showers', sev: 'wet' };
  if (c === 85 || c === 86) return { ic: '🌨', label: 'Snow showers', sev: 'snow' };
  if (c >= 95) return { ic: '⛈', label: c === 95 ? 'Thunderstorm' : 'Thunderstorm w/ hail', sev: 'storm' };
  return { ic: '🌡', label: '—', sev: 'good' };
}
const sevColor = { good: '#22c55e', wet: '#3b82f6', storm: '#a855f7', warn: '#f59e0b', snow: '#7dd3fc' };

/* ---------- current weather ---------- */
async function fetchCurrentWeather(force) {
  if (!S.pos) return;
  const moved = S.wxAt ? haversine(S.wxAt, S.pos) : Infinity;
  if (!force && Date.now() - S.wxTime < 10 * 60e3 && moved < 8000) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${S.pos[1].toFixed(4)}&longitude=${S.pos[0].toFixed(4)}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,relative_humidity_2m,is_day` +
      `&minutely_15=precipitation,precipitation_probability&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m,is_day` +
      `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timeformat=unixtime&timezone=auto&forecast_days=2`;
    const r = await fetch(u); if (!r.ok) throw 0;
    S.wx = await r.json(); S.wxAt = S.pos.slice(); S.wxTime = Date.now();
    renderWxChip();
    if (S.ride) S.ride.wxSeen.push({ t: Date.now(), code: S.wx.current.weather_code, temp: S.wx.current.temperature_2m, wind: S.wx.current.wind_speed_10m });
  } catch (e) { console.warn('weather', e); }
  fetchAlerts();
}
function nextHourRain(wx) {
  const m = wx.minutely_15; if (!m) return null;
  const now = Date.now() / 1000; let start = null, maxP = 0;
  for (let i = 0; i < m.time.length; i++) {
    if (m.time[i] < now - 900 || m.time[i] > now + 3600) continue;
    const p = m.precipitation_probability?.[i] ?? 0, a = m.precipitation?.[i] ?? 0;
    maxP = Math.max(maxP, p); if (start === null && (a > 0 || p >= 50)) start = m.time[i];
  }
  return { start, maxP };
}
function renderWxChip() {
  const c = S.wx?.current; if (!c) return;
  const w = wmo(c.weather_code, c.is_day);
  $('#wx .ic').textContent = w.ic; $('#wx .t').textContent = Math.round(c.temperature_2m) + '°';
  $('#wxmini .ic').textContent = w.ic; $('#wxmini .t').textContent = Math.round(c.temperature_2m) + '°';
  const nr = nextHourRain(S.wx);
  const rainLine = nr && nr.start ? (nr.start <= Date.now() / 1000 ? 'Raining now' : 'Rain in ' + Math.max(1, Math.round((nr.start - Date.now() / 1000) / 60)) + ' min') : (nr && nr.maxP >= 30 ? nr.maxP + '% rain next hr' : 'Dry next hour');
  $('#wx .w').innerHTML = `${Math.round(c.wind_speed_10m)} mph ${compassShort(c.wind_direction_10m)}<br>${rainLine}`;
}

/* ---------- NWS alerts ---------- */
const sevRank = { Extreme: 0, Severe: 1, Moderate: 2, Minor: 3, Unknown: 4 };
async function fetchAlerts() {
  if (!S.pos || Date.now() - S.alertsTime < 10 * 60e3) return;
  S.alertsTime = Date.now();
  try {
    const r = await fetch(`https://api.weather.gov/alerts/active?point=${S.pos[1].toFixed(4)},${S.pos[0].toFixed(4)}`, { headers: { Accept: 'application/geo+json' } });
    if (!r.ok) throw 0;
    const j = await r.json();
    S.alerts = (j.features || []).map(f => f.properties).sort((a, b) => (sevRank[a.severity] ?? 4) - (sevRank[b.severity] ?? 4));
  } catch (e) { console.warn('alerts', e); S.alerts = []; }
  renderAlert();
}
function renderAlert() {
  const el = $('#alert'), badge = $('#alertbadge');
  if (!S.alerts.length) { el.classList.add('hidden'); badge.classList.add('hidden'); return; }
  const a = S.alerts[0];
  el.className = (a.severity === 'Moderate' ? 'moderate' : a.severity === 'Minor' ? 'minor' : '');
  $('#alerttitle').textContent = a.event + (S.alerts.length > 1 ? ` +${S.alerts.length - 1} more` : '');
  $('#alertsub').textContent = a.ends ? 'Until ' + new Date(a.ends).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : 'Tap for details';
  // while riding: a badge only, unless an alert is new since the ride began
  const isNew = S.alerts.some(x => !S.seenAlerts[x.id]);
  S.alerts.forEach(x => { S.seenAlerts[x.id] = true; });
  if (S.navigating) { badge.classList.remove('hidden'); el.classList.add('hidden'); if (isNew && S.ride) { toast('Weather alert: ' + a.event, 5000); speak('Weather alert. ' + a.event); } }
  else { badge.classList.add('hidden'); el.classList.remove('hidden'); }
}
$('#alert').onclick = () => openWxPanel(true);
$('#alertbadge').onclick = () => openWxPanel(true);

/* ---------- weather panel (+ radar toggle) ---------- */
function openWxPanel(scrollToAlerts) {
  const wx = S.wx, c = wx?.current; let html = '';
  if (c) {
    const w = wmo(c.weather_code, c.is_day);
    html += `<div class="cur"><div class="ic">${w.ic}</div><div><div class="t">${Math.round(c.temperature_2m)}°</div><div class="d">${w.label} · feels like ${Math.round(c.apparent_temperature)}°</div></div></div>`;
    html += `<div class="grid"><div><b>${Math.round(c.wind_speed_10m)} <small>mph</small></b><span>wind ${compassShort(c.wind_direction_10m)}</span></div><div><b>${Math.round(c.wind_gusts_10m)} <small>mph</small></b><span>gusts</span></div><div><b>${c.relative_humidity_2m}%</b><span>humidity</span></div></div>`;
    html += '<h3>Next 12 hours</h3><div id="hours">';
    const now = Date.now() / 1000, h = wx.hourly; let n = 0;
    for (let i = 0; i < h.time.length && n < 12; i++) {
      if (h.time[i] < now - 3600) continue; n++;
      const hw = wmo(h.weather_code[i], h.is_day[i]);
      html += `<div class="pt ${hw.sev}"><div class="mi">${fmtTime(new Date(h.time[i] * 1000))}</div><div class="ic">${hw.ic}</div><div class="tp">${Math.round(h.temperature_2m[i])}°</div><div class="pp">${h.precipitation_probability[i]}% · ${Math.round(h.wind_speed_10m[i])} mph</div></div>`;
    }
    html += '</div>';
  } else html += '<p>Weather not loaded yet — waiting for a location.</p>';
  html += `<h3>Map</h3><button class="toggle ${S.radarOn ? 'on' : ''}" id="radartoggle"><span>🌧 Rain radar overlay</span><span class="sw"></span></button>`;
  html += `<h3 id="alerts-h">Alerts (${S.alerts.length})</h3>`;
  if (!S.alerts.length) html += '<p style="color:var(--muted)">No active National Weather Service alerts for your location.</p>';
  for (const a of S.alerts) html += `<div class="alertcard"><b>${a.event}</b><div style="font-size:14px">${a.headline || ''}</div><p>${(a.description || '').replace(/</g, '&lt;')}</p></div>`;
  html += `<div class="actions"><button class="btn" id="wxclose">Close</button></div>`;
  $('#wxcard').innerHTML = html; $('#wxpanel').classList.remove('hidden');
  $('#wxclose').onclick = () => $('#wxpanel').classList.add('hidden');
  $('#radartoggle').onclick = async () => { await toggleRadar(); $('#radartoggle').classList.toggle('on', S.radarOn); };
  if (scrollToAlerts) $('#alerts-h').scrollIntoView();
}
$('#wx').onclick = () => openWxPanel(false);
$('#wxmini').onclick = () => openWxPanel(false);
$('#wxpanel').onclick = e => { if (e.target.id === 'wxpanel') e.target.classList.add('hidden'); };

/* ---------- radar (RainViewer) ---------- */
async function toggleRadar() {
  S.radarOn = !S.radarOn;
  if (!S.radarOn) { stopRadar(); return; }
  await mapReady;
  try {
    const j = await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
    const frames = j.radar.past.slice(-7).concat(j.radar.nowcast ? j.radar.nowcast.slice(0, 2) : []);
    S.radar = { host: j.host, frames };

}

  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
  m.lean = Math.atan2(dot(G, c.lat), dot(G, c.up)) * 180 / Math.PI;

function levelPhone() {   // call while the bike is upright: records the gravity direction as "up" in the phone's frame
  const m = S.motion, G = m.gfilt; const n = Math.hypot(...G); if (!m.ok || n < 5) { toast('Hold still a second, then tap Level again'); return false; }

/* ---------- battery ---------- */

  $('#ridesbtn').classList.add('hidden'); $('#startbtn').classList.add('hidden'); $('#endbtn').classList.remove('hidden'); $('#barspeed').classList.remove('hidden');
  $('#planactions').classList.add('hidden'); $('.modes').classList.add('hidden');
  if (S.alerts.length) $('#alertbadge').classList.remove('hidden');

  document.body.classList.remove('nav');

  $('#planactions').classList.remove('hidden'); $('.modes').classList.remove('hidden'); $('#live').classList.add('hidden');

$('#startbtn').onclick = () => { if (!S.route || !S.pos) return; $('#levelstate').textContent = S.motion.cal ? 'Levelled earlier — tap again if you re-mounted the phone' : ''; $('#levelscreen').classList.remove('hidden'); };
$('#levelgo').onclick = async () => {
  const st = $('#levelstate'); st.textContent = 'Hold still…'; $('#levelgo').disabled = true;
  const ok = await enableMotion(); if (!ok) { st.textContent = 'Motion sensors not available — starting without lean'; }
  else {
    for (let i = 0; i < 20 && Math.hypot(...S.motion.gfilt) < 5; i++) await new Promise(r => setTimeout(r, 100));   // wait for the first sensor readings

    else { await new Promise(r => setTimeout(r, 500)); if (!levelPhone()) { st.textContent = 'Couldn’t read the sensors — hold still and tap again'; $('#levelgo').disabled = false; return; } st.textContent = '✓ Levelled'; }

$('#clearbtn').onclick = () => endNavigation(true);

}
function navTick() {

  r.remainingDist = Math.max(0, r.distance - np.along); r.remainingTime = Math.max(0, r.duration - r.cumT[ci]);
  let si = r.steps.findIndex((s, i) => i > 0 && s.startDist > np.along + 8); if (si === -1) si = r.steps.length - 1;
  const step = r.steps[si], dist = Math.max(0, step.startDist - np.along);
  $('#banner .arrow').textContent = step.arrow; $('#banner .dist').textContent = fmtDist(dist); $('#banner .text').textContent = step.instruction;
  const nxt = r.steps[si + 1]; const thenEl = $('#banner .then');
  if (nxt && nxt.startDist - step.startDist < 250 && !step.isArrive) { thenEl.textContent = 'then ' + nxt.instruction; thenEl.classList.remove('hidden'); } else thenEl.classList.add('hidden');

}

  const samples = await DB.get(r.id) || [];
  const lean = r.maxLeanL != null ? `${r.maxLeanL}° L / ${r.maxLeanR}° R` : '—';
  $('#summarycard').innerHTML = `<h2>${r.to}</h2><div style="color:var(--muted);margin:4px 0 6px">${new Date(r.date).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>
    <div class="stats"><div><b>${r.miles}</b><span>miles</span></div><div><b>${fmtHM((r.movingMin || 0) * 60)}</b><span>moving</span></div><div><b>${fmtHM((r.totalMin || 0) * 60)}</b><span>total</span></div>
    <div><b>${r.avg ?? '—'}</b><span>avg mph</span></div><div><b>${r.max ?? '—'}</b><span>max mph</span></div><div><b>${fmtFt(r.gain || 0)}</b><span>ft climbed</span></div>
    <div><b>${fmtFt(r.loss || 0)}</b><span>ft descended</span></div><div><b>${r.hi != null ? fmtFt(r.hi) : '—'}</b><span>high point ft</span></div><div><b>${lean}</b><span>max lean</span></div>
    <div><b>${r.maxBrake != null ? r.maxBrake + ' g' : '—'}</b><span>hardest brake</span></div><div><b>${r.maxAccel != null ? r.maxAccel + ' g' : '—'}</b><span>hardest accel</span></div><div><b>${samples.length}</b><span>gps points</span></div></div>
    ${r.headline ? `<div class="head good" style="margin-top:12px"><span class="ic">🌤</span><span>${r.headline}</span></div>` : ''}
    <div class="actions"><button class="btn" id="sumclose">Close</button>${samples.length ? '<button class="btn primary" id="showtrack">Show on map</button>' : ''}</div>`;
  $('#summary').classList.remove('hidden');
  $('#sumclose').onclick = () => $('#summary').classList.add('hidden');
  const st = $('#showtrack'); if (st) st.onclick = () => {
    $('#summary').classList.add('hidden'); $('#ridespanel').classList.add('hidden');
    const coords = samples.map(s => [s.lng, s.lat]); map.getSource('track').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
    const b = coords.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0])); map.fitBounds(b, { padding: 80, duration: 800, pitch: 0, bearing: 0 });
    $('#trackname').textContent = `${r.to} · ${r.miles} mi`; $('#trackbar').classList.remove('hidden'); $('#top').classList.add('hidden');
  };
}
$('#trackclose').onclick = () => { map.getSource('track').setData(EMPTY); $('#trackbar').classList.add('hidden'); $('#top').classList.remove('hidden'); openRides(); };
$('#ridesbtn').onclick = openRides;

/* ---------- boot ---------- */
document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.navigating) { try { if (CAP && CAP.KeepAwake) CAP.KeepAwake.keepAwake(); else S.wake = await navigator.wakeLock?.request('screen'); } catch (e) { } } });
setInterval(() => { if (S.pos) fetchCurrentWeather(false); }, 60e3);
setInterval(() => { if (S.route && !S.navigating) updateSheetStats(); }, 30e3);
setInterval(() => { if (S.navigating) checkBattery(); }, 120e3);
setInterval(() => { if (S.navigating) renderHeading(); }, 300);
if (params.has('lat') && params.has('lon')) setPosition(+params.get('lon'), +params.get('lat'), 0, 0, null, true); else startGeolocation();
if (!CAP && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
window.__back = () => {
  for (const id of ['#summary', '#wxpanel', '#ridespanel']) { const el = $(id); if (el && !el.classList.contains('hidden')) { el.classList.add('hidden'); return true; } }
  if (!$('#trackbar').classList.contains('hidden')) { $('#trackclose').click(); return true; }
  if (!$('#results').classList.contains('hidden')) { $('#results').classList.add('hidden'); return true; }
  if (S.route && !S.navigating) { endNavigation(true); return true; }
  return false;
};
window.__openLink = url => { try { const u = new URL(url); const to = u.searchParams.get('to'); if (!to) return; const [lat, lng] = to.split(',').map(Number); if (u.searchParams.get('mode')) { S.mode = u.searchParams.get('mode'); store.set('mode', S.mode); } const name = u.searchParams.get('name') || 'Shared destination'; $('#q').value = name; setDestination([lng, lat], name, ''); } catch (e) { } };
if (params.has('to')) window.__openLink(location.href);
</script>
</body>
</html>
